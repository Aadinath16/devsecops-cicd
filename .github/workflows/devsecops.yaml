name: Pipeline-Tooling-Dashboard

on:
  push:
    branches: [ "dev", "feat" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # Converts the repository name to lowercase safely to meet Docker standard specifications
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # STAGE 1: Free Secrets & Code Scanning
  static-analysis:
    name: Secrets & SAST (Free Core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1.1 Open-Source Secrets Detection
      - name: Scan Secrets (TruffleHog OSS)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      # 1.2 Open-Source Static Application Security Testing
      - name: Run SAST (Semgrep OSS Rules)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit

  # STAGE 2: Free Dependency & Software Composition Analysis (SCA)
  dependency-scan:
    name: Dependency Scan (Trivy OSS)
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2.1 Scan software repositories for vulnerable open-source libraries
      - name: Run Trivy Repo Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1' # Fail pipeline if HIGH/CRITICAL CVEs exist
          severity: 'CRITICAL,HIGH'

  # STAGE 3: Run pytest Suite against the Flask App code
  application-test:
    name: Application pytest
    runs-on: ubuntu-latest
    needs: dependency-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up subsequent pipeline runs automatically

      - name: Running Pytest
        run: |
          pip install -r requirements.txt
          pytest

  # STAGE 4: Build, Container Scan, SBOM, and Cryptographic Sign
  container-security:
    name: Container Build & Supply Chain
    runs-on: ubuntu-latest
    needs: application-test
    permissions:
      contents: read
      packages: write
      id-token: write # Vital for free Sigstore/Cosign keyless signing
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOC_TOKEN }} # Automatically provided by GitHub actions, no secret setup required!

      # 4.1 Build locally first to verify setup
      - name: Build Local Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false 
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          load: true

      # 4.2 Free Container Image Vulnerability Scanning
      - name: Scan Container Image (Trivy OSS)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: 'table'
          exit-code: '1' # Blocks push if vulnerability rules fail
          ignore-unfixed: true 
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 4.3 Push Secure Image (Only if step 4.2 passes successfully)
      - name: Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # 4.4 Open-Source Software Bill of Materials (SBOM) Generation
      - name: Generate SBOM (Syft OSS)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: ./sbom.spdx.json

      # 4.5 Free Artifact Signing (Keyless Sigstore Architecture)
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.4.0

      - name: Cryptographically Sign Image
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}