<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevSecOps POC Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <div class="container mx-auto p-6 max-w-4xl">
        <header class="mb-8 border-b border-gray-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-indigo-400">Pipeline Tooling Dashboard</h1>
                <p class="text-gray-400 text-sm">Flask POC Backend + Async Frontend</p>
            </div>
            <span class="bg-green-900 text-green-300 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-green-500">
                System Operational
            </span>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-gray-800 p-6 rounded-lg shadow-md h-fit">
                <h2 class="text-xl font-semibold mb-4 text-indigo-300">Add New Tool</h2>
                <form id="toolForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Tool Name</label>
                        <input type="text" id="toolName" required 
                            class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Status</label>
                        <select id="toolStatus" 
                            class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-indigo-500">
                            <option value="Active">Active</option>
                            <option value="Pending">Pending</option>
                            <option value="Disabled">Disabled</option>
                        </select>
                    </div>
                    <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded transition duration-200">
                        Add to Pipeline
                    </button>
                </form>
            </div>

            <div class="md:col-span-2 bg-gray-800 p-6 rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-indigo-300">Pipeline components</h2>
                    <button id="refreshBtn" class="text-sm bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded transition">
                        🔄 Refresh
                    </button>
                </div>
                
                <div id="itemsContainer" class="space-y-3">
                    <p class="text-gray-400 italic">Loading tools...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
